services:
  browser:
    build:
      context: .
      dockerfile: tests/browser/Dockerfile
    profiles: [browser]
    init: true
    shm_size: 1gb
    network_mode: service:controller
    environment:
      CI: "true"
      MONDEK_BROWSER_BASE_URL: http://localhost:4000
      MONDEK_BROWSER_SUITE: linux
      MONDEK_BROWSER_OUTPUT: /artifacts
    volumes:
      - "${MONDEK_BROWSER_ARTIFACTS}:/artifacts"
