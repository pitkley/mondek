name: mondek
services:
  controller:
    image: ${MONDEK_IMAGE:-ghcr.io/pitkley/mondek/controller:0.0.1a2}
    env_file: ${MONDEK_ENV_FILE:-.env}
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: mondek
      PGUSER: mondek
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in the private environment file}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in the private environment file}
      MONDEK_BIND_ADDRESS: 0.0.0.0
      MONDEK_NOTIFICATION_ADAPTER: ${MONDEK_NOTIFICATION_ADAPTER:-smtp}
      MONDEK_SMTP_HOST: ${MONDEK_SMTP_HOST:-}
      MONDEK_SMTP_FROM: ${MONDEK_SMTP_FROM:-}
      MONDEK_SMTP_TO: ${MONDEK_SMTP_TO:-}
      PORT: "4000"
    ports:
      - "127.0.0.1:${MONDEK_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 15s
    logging: &logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: mondek
      POSTGRES_DB: mondek
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in the private environment file}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mondek -d mondek"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logs
volumes:
  postgres_data:
