[project]
name = "mondek-local-examples"
version = "0.1.0"
description = "Ordinary node-local and datasource consumers for Mondek"
requires-python = ">=3.13"
dependencies = ["mondek"]

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mondek_examples"

[tool.uv.sources]
mondek = { path = "../../runner", editable = true }
