name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version tag after qualification and environment approval
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    # Relative reusable workflows are resolved at the caller's commit.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      prepare_release: true
  images:
    name: Qualify Linux/${{ matrix.architecture }} controller
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.15'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.5'
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sdk
          path: sdk
      - name: Verify SDK and release version
        id: version
        run: |
          python3 scripts/release.py verify-sdk --directory sdk
          python3 -c 'import json; print("image_tag=" + json.load(open("sdk/sdk-build.json"))["image_tag"])' >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 scripts/release.py check --tag "$GITHUB_REF_NAME"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the native controller once, without registry access
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: controller/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          push: false
          tags: mondek-release:${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=https://github.com/pitkley/mondek
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.image_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=mondek-release-${{ matrix.architecture }}
          cache-to: type=gha,scope=mondek-release-${{ matrix.architecture }},mode=max
      - name: Test the exact image and installed SDK together
        run: |
          python3 tests/e2e/install.py --image "mondek-release:$ARCHITECTURE" --sdk-wheel sdk/*.whl
          mkdir -p .local/release/evidence
          python3 scripts/image_licenses.py controller "mondek-release:$ARCHITECTURE" --output .local/release/evidence/licenses.json
      - name: Export the qualified image without rebuilding
        run: |
          python3 scripts/release.py save-image --image "mondek-release:$ARCHITECTURE" --architecture "$ARCHITECTURE" --sdk-directory sdk --output .local/release/controller
          cp .local/release/evidence/licenses.json .local/release/controller/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controller-${{ matrix.architecture }}
          path: .local/release/controller/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain bounded installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-install-${{ matrix.architecture }}
          path: .local/acceptance/
          include-hidden-files: true
          retention-days: 7
  testpypi:
    name: Approve publication and upload the SDK to TestPyPI
    needs: [ci, images]
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.repository == 'pitkley/mondek' && startsWith(github.ref, 'refs/tags/v') && vars.MONDEK_ENABLE_PUBLICATION == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: testpypi
    permissions:
      contents: read
      id-token: write # Exchange this protected job identity for a short-lived PyPI token.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sdk
          path: sdk
      - name: Verify and select the original distribution pair
        run: |
          (cd sdk && sha256sum -c SHA256SUMS)
          mkdir dist
          cp sdk/*.whl sdk/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          attestations: true
  ghcr:
    name: Publish the qualified controller images
    needs: [ci, images, testpypi]
    # Main publishes edge after qualification; version publication retains its approval gate.
    if: >-
      !cancelled() && needs.ci.result == 'success' && needs.images.result == 'success' &&
      github.repository == 'pitkley/mondek' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.testpypi.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # Push the already qualified controller layers to GHCR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sdk
          path: sdk
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: controller-*
          path: images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify and load exactly the qualified image exports
        run: |
          flags=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            flags+=(--tag "$GITHUB_REF_NAME")
          fi
          for arch in amd64 arm64; do
            python3 scripts/release.py load-image --directory "images/controller-$arch" --architecture "$arch" --sdk-directory sdk "${flags[@]}"
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push existing images and assemble the platform index and mutable tag
        run: |
          repository="ghcr.io/pitkley/mondek/controller"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            image="$repository:${GITHUB_REF_NAME#v}"
            alias="$repository:latest"
          else
            image="$repository:sha-$GITHUB_SHA"
            alias="$repository:edge"
          fi
          for arch in amd64 arm64; do
            docker tag "mondek-release:$arch" "$image-$arch"
            docker push "$image-$arch"
          done
          docker buildx imagetools create --tag "$image" --tag "$alias" "$image-amd64" "$image-arm64"
          docker buildx imagetools inspect "$image"
  pypi:
    name: Publish the same SDK pair to PyPI
    needs: ghcr
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write # Exchange this protected job identity for a short-lived PyPI token.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sdk
          path: sdk
      - name: Verify the same original distribution pair
        run: |
          (cd sdk && sha256sum -c SHA256SUMS)
          mkdir dist
          cp sdk/*.whl sdk/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
  github-release:
    name: Attach alpha notes and distribution evidence
    needs: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Create the approved versioned GitHub Release and its assets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sdk
          path: sdk
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: controller-*
          path: images
      - name: Create the versioned release with the original packages and image evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd sdk && sha256sum -c SHA256SUMS)
          mkdir release-assets
          cp sdk/*.whl sdk/*.tar.gz sdk/SHA256SUMS sdk/sdk-build.json release-assets/
          for arch in amd64 arm64; do
            cp "images/controller-$arch/licenses.json" "release-assets/controller-$arch-licenses.json"
            cp "images/controller-$arch/image.json" "release-assets/controller-$arch-image.json"
          done
          flags=(--verify-tag --notes-file docs/RELEASE-NOTES.md)
          if jq -e '.controller | contains("-")' sdk/sdk-build.json >/dev/null; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* "${flags[@]}"
